const SESSION_ORDER = ["PUSH","PULL","LEGS","ATHLETIC"];
const STORAGE_KEY = "surf_tracker_v6";
const EMPTY_DATA = { overrides:{}, history:[], log:[], initialized:false, noEquip:{} };

function loadData() {
  try {
    // Migrer depuis v4 si nécessaire
    const old = localStorage.getItem("surf_tracker_v4");
    const cur = localStorage.getItem(STORAGE_KEY);
    if (cur) return JSON.parse(cur);
    if (old) {
      const parsed = JSON.parse(old);
      return { overrides:{}, history: parsed.history||[], log: parsed.log||[], initialized: true, noEquip:{} };
    }
    return EMPTY_DATA;
  } catch { return EMPTY_DATA; }
}
function saveData(d) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); } catch {} }

function exportData(d) {
  const json = JSON.stringify(d, null, 2);
  const blob = new Blob([json], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `surf-training-backup-${new Date().toISOString().split("T")[0]}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData(file, onSuccess, onError) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (!parsed.log || !parsed.overrides) throw new Error("Format invalide");
      onSuccess({...EMPTY_DATA, ...parsed, initialized: true});
    } catch { onError(); }
  };
  reader.readAsText(file);
}

function localDateStr(d) {
  const dt = d || new Date();
  const y = dt.getFullYear();
  const m = String(dt.getMonth()+1).padStart(2,"0");
  const day = String(dt.getDate()).padStart(2,"0");
  return y+"-"+m+"-"+day;
}
function todayStr() { return localDateStr(); }
function daysDiff(a, b) { return Math.round((new Date(b+"T12:00:00") - new Date(a+"T12:00:00")) / 86400000); }

function computeStatus(log) {
  const today = todayStr();
  const yesterday = localDateStr(new Date(Date.now()-86400000));
  const todayEntry = log.find(e=>e.date===today);
  const yestEntry  = log.find(e=>e.date===yesterday);
  if (todayEntry) return { status:"done", todayType:todayEntry.type, session:todayEntry.session };
  if (yestEntry?.type==="surf") return { status:"rest", reason:"Tu as surfé hier — repos J+1" };
  if (yestEntry?.type==="gym")  return { status:"ready" };
  const lastEntry = [...log].sort((a,b)=>b.date.localeCompare(a.date))[0];
  if (!lastEntry) return { status:"ready" };
  const daysSince = daysDiff(lastEntry.date, today);
  if (daysSince >= 3) return { status:"warning", reason:`${daysSince} jours sans activité` };
  return { status:"ready" };
}

function nextSession(log) {
  const gymLogs = log.filter(e=>e.type==="gym").sort((a,b)=>b.date.localeCompare(a.date));
  if (!gymLogs.length) return "PUSH";
  const last = gymLogs[0].session;
  const idx = SESSION_ORDER.indexOf(last);
  return SESSION_ORDER[(idx+1)%SESSION_ORDER.length];
}

function getWeekLog(log) {
  const now = new Date(); const monday = new Date(now);
  monday.setDate(now.getDate()-((now.getDay()+6)%7)); monday.setHours(0,0,0,0);
  return log.filter(e=>new Date(e.date+"T12:00:00")>=monday);
}

// ─── EXERCISE CARD (avec switch sans matériel) ───────────────────────────────
function ExerciseCard({ex, idx, color, data, noEquipMap, onToggleNoEquip, onEdit, readOnly}){
  const useAlt = noEquipMap[ex.id] && ex.alt;
  const override = data.overrides[ex.id];
  const isModified = !!(override?.sets || override?.reps || override?.load || override?.rest);

  // Les valeurs affichées dépendent du mode alt ou non
  const displayEx = useAlt ? {...ex, name:ex.alt.name, load:ex.alt.load, reps:ex.alt.reps, notes:ex.alt.notes} : ex;
  const sets = override?.sets ?? displayEx.sets;
  const reps = override?.reps ?? displayEx.reps;
  const load = override?.load ?? displayEx.load;
  const rest = override?.rest ?? ex.rest;
  const hasNote = override?.userNote;

  return(
    <div style={{marginBottom:10,background:"rgba(255,255,255,0.03)",borderRadius:12,border:`1px solid ${useAlt?"#f59e0b40":isModified?color+"40":"rgba(255,255,255,0.06)"}`,overflow:"hidden"}}>
      <div style={{display:"flex",alignItems:"flex-start",gap:12,padding:"12px 14px"}}>
        <div style={{width:26,height:26,borderRadius:"50%",background:`${color}20`,border:`1px solid ${color}40`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700,color,flexShrink:0,marginTop:1}}>{idx+1}</div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:15,fontWeight:600,marginBottom:2,display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
            {displayEx.name}
            {isModified&&!useAlt&&<span style={{fontSize:10,color,background:`${color}18`,padding:"1px 6px",borderRadius:10}}>modifié</span>}
            {useAlt&&<span style={{fontSize:10,color:"#f59e0b",background:"rgba(245,158,11,0.12)",padding:"1px 6px",borderRadius:10}}>sans matériel</span>}
          </div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:4}}>
            <span style={{fontSize:12,background:"rgba(255,255,255,0.07)",borderRadius:6,padding:"2px 8px",color:"rgba(255,255,255,0.7)"}}>{sets} séries</span>
            <span style={{fontSize:12,background:"rgba(255,255,255,0.07)",borderRadius:6,padding:"2px 8px",color:"rgba(255,255,255,0.7)"}}>{reps}</span>
            <span style={{fontSize:12,background:useAlt?"rgba(245,158,11,0.15)":`${color}18`,borderRadius:6,padding:"2px 8px",color:useAlt?"#f59e0b":color,fontWeight:600}}>{load}</span>

          </div>
          <div style={{fontSize:12,color:"rgba(255,255,255,0.35)",fontStyle:"italic"}}>💡 {displayEx.notes}</div>
          {hasNote&&<div style={{fontSize:12,color,marginTop:4,fontStyle:"italic"}}>📝 {override.userNote}</div>}
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:6,flexShrink:0}}>
          {ex.alt && !readOnly && (
            <button onClick={()=>onToggleNoEquip(ex.id)}
              style={{background:useAlt?"rgba(245,158,11,0.2)":"rgba(255,255,255,0.07)",border:useAlt?"1px solid rgba(245,158,11,0.4)":"1px solid rgba(255,255,255,0.1)",borderRadius:8,padding:"5px 9px",color:useAlt?"#f59e0b":"rgba(255,255,255,0.4)",cursor:"pointer",display:"flex",gap:4,alignItems:"center",fontSize:11,fontWeight:600,whiteSpace:"nowrap"}}>

    </div>
  );
}

function SessionPreview({sessionKey, data, onUpdate, onStart, onBack, readOnly=false}){
  const s = PROGRAM[sessionKey];
  const allExs = [...KINE_EX, ...s.exercises];
  const color = s.color;
  const [editIdx, setEditIdx] = useState(null);
  const noEquipMap = data.noEquip || {};

  const handleSave = (id, vals) => {
    onUpdate({...data, overrides:{...data.overrides, [id]:vals}});
    setEditIdx(null);
  };

  const handleToggleNoEquip = (id) => {
    const cur = data.noEquip || {};
    onUpdate({...data, noEquip:{...cur, [id]:!cur[id]}});
  };

  const sessionIcon = sessionKey==="PUSH"?"🔵":sessionKey==="PULL"?"🟢":sessionKey==="LEGS"?"🟠":"⚡";

  return(
    <div style={{minHeight:"100vh",background:"#0a0f1e",color:"#fff",fontFamily:"'Outfit',sans-serif"}}>
      <div style={{padding:"16px 20px 0",display:"flex",alignItems:"center",gap:12}}>
        <button onClick={onBack} style={{background:"none",border:"none",color:"rgba(255,255,255,0.45)",cursor:"pointer",padding:4}}><Ic.back/></button>
        <div>
          <div style={{fontSize:11,color,fontWeight:700,letterSpacing:2}}>{s.label}</div>
          <div style={{fontSize:14,color:"rgba(255,255,255,0.5)"}}>{s.subtitle}</div>
        </div>
        {readOnly && <div style={{marginLeft:"auto",fontSize:11,color:"rgba(255,255,255,0.3)",background:"rgba(255,255,255,0.06)",padding:"3px 10px",borderRadius:20}}>HISTORIQUE</div>}
      </div>

      <div style={{padding:"20px 20px",paddingBottom: readOnly ? "40px" : "120px"}}>
        <div style={{background:`${color}12`,border:`1px solid ${color}30`,borderRadius:14,padding:"14px 16px",marginBottom:20,display:"flex",gap:16,alignItems:"center"}}>
          <div style={{fontSize:32}}>{sessionIcon}</div>
          <div>
            <div style={{fontSize:16,fontWeight:700,color}}>{s.label}</div>
            <div style={{fontSize:13,color:"rgba(255,255,255,0.5)",marginTop:3}}>
              {allExs.length} exercices · ~50-60 min
            </div>
          </div>
        </div>

        {!readOnly && (
          <div style={{fontSize:13,color:"rgba(255,255,255,0.35)",background:"rgba(255,255,255,0.04)",borderRadius:10,padding:"10px 14px",marginBottom:18,fontStyle:"italic"}}>
            💡 Tape <strong style={{color:"rgba(255,255,255,0.5)"}}>No équip</strong> sur un exercice pour basculer vers l'alternative sans matériel.
          </div>
        )}

        {/* Bloc Kiné */}
        <div style={{fontSize:11,color:"rgba(255,255,255,0.3)",letterSpacing:2,marginBottom:10}}>🩺 BLOC KINÉ (5 MIN)</div>
        {KINE_EX.map((ex,i)=>(
          <ExerciseCard key={ex.id} ex={ex} idx={i} color="#64748b" data={data}
            noEquipMap={noEquipMap} onToggleNoEquip={()=>{}} onEdit={()=>setEditIdx(-1-i)} readOnly={readOnly}/>
        ))}

        {/* Exercices principaux */}
        <div style={{fontSize:11,color:"rgba(255,255,255,0.3)",letterSpacing:2,marginBottom:10,marginTop:20}}>
          {sessionKey==="ATHLETIC" ? "⚡ CIRCUIT TABATA" : "EXERCICES"}
        </div>
        {s.exercises.map((ex,i)=>(
          <ExerciseCard key={ex.id} ex={ex} idx={i} color={color} data={data}
            noEquipMap={noEquipMap} onToggleNoEquip={handleToggleNoEquip}
            onEdit={()=>setEditIdx(KINE_EX.length+i)} readOnly={readOnly}/>
        ))}

        {/* Mobilité pour LEGS */}
        {sessionKey==="LEGS" && s.mobilite && (
          <div style={{marginTop:20,background:"rgba(249,115,22,0.06)",border:"1px solid rgba(249,115,22,0.2)",borderRadius:12,padding:"14px 16px"}}>
            <div style={{fontSize:11,color:"rgba(255,255,255,0.3)",letterSpacing:2,marginBottom:8}}>🧘 MOBILITÉ (15 MIN)</div>
            <div style={{fontSize:15,fontWeight:600,color:"rgba(255,255,255,0.8)",marginBottom:4}}>Routine YouTube</div>
            <div style={{fontSize:14,color:"#f97316",fontStyle:"italic"}}>{s.mobilite}</div>
          </div>
        )}

        {/* Circuit alternatif pour ATHLETIC */}
        {sessionKey==="ATHLETIC" && s.altCircuit && (
          <div style={{marginTop:16,background:"rgba(168,85,247,0.06)",border:"1px solid rgba(168,85,247,0.2)",borderRadius:12,padding:"14px 16px"}}>
            <div style={{fontSize:11,color:"rgba(255,255,255,0.3)",letterSpacing:2,marginBottom:8}}>OU — {s.altCircuit.name.toUpperCase()}</div>
            {s.altCircuit.steps.map((step,i)=>(
              <div key={i} style={{fontSize:14,color:"rgba(255,255,255,0.6)",padding:"4px 0",borderBottom:i<s.altCircuit.steps.length-1?"1px solid rgba(255,255,255,0.05)":"none"}}>
                <span style={{color:"#a855f7",fontWeight:700,marginRight:8}}>{i+1}.</span>{step}
              </div>
            ))}
          </div>
        )}
      </div>

      {!readOnly && (
        <div style={{position:"fixed",bottom:0,left:0,right:0,padding:"16px 20px 32px",background:"linear-gradient(to top, #0a0f1e 70%, transparent)"}}>
          <button onClick={onStart} style={{width:"100%",padding:"16px",background:color,border:"none",borderRadius:14,color:"#fff",fontSize:17,fontWeight:800,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:10}}>
            <Ic.play/> Commencer la séance
          </button>
        </div>
      )}

      {editIdx!==null && (
        (() => {
          const isKine = editIdx < 0;
          const ex = isKine ? KINE_EX[-1-editIdx] : allExs[editIdx];
          const c = isKine ? "#64748b" : color;
          return <EditModal ex={ex}
            current={data.overrides[ex.id] || {sets:ex.sets,reps:ex.reps,load:ex.load,rest:ex.rest}}
            color={c} onSave={v=>handleSave(ex.id,v)} onClose={()=>setEditIdx(null)}/>;
        })()
      )}
    </div>
  );
}

// ─── SESSION VIEW ─────────────────────────────────────────────────────────────
function SessionView({sessionKey, data, onUpdate, onBack}){
  const s = PROGRAM[sessionKey];
  const allExs = [...KINE_EX, ...s.exercises];
  const color = s.color;
  const [step, setStep] = useState(0);
  const [liveNotes, setLiveNotes] = useState({});
  const noEquipMap = data.noEquip || {};

  const totalSteps = allExs.length;
  const curEx = step < totalSteps ? allExs[step] : null;
  const useAlt = curEx && noEquipMap[curEx.id] && curEx.alt;
  const displayEx = useAlt ? {...curEx, name:curEx.alt.name, load:curEx.alt.load, reps:curEx.alt.reps, notes:curEx.alt.notes} : curEx;
  const curData = curEx ? (data.overrides[curEx.id] || {sets:displayEx.sets,reps:displayEx.reps,load:displayEx.load,rest:curEx.rest}) : null;

  const handleToggleNoEquip = (id) => {
    const cur = data.noEquip || {};
    onUpdate({...data, noEquip:{...cur, [id]:!cur[id]}});
  };

  const completeSession = () => {
    const entry = {
      date: todayStr(), type:"gym", session:sessionKey, label:s.label,
      exercises: allExs.map(ex => ({
        name: (noEquipMap[ex.id] && ex.alt) ? ex.alt.name : ex.name,
        ...(data.overrides[ex.id] || {sets:ex.sets, reps:ex.reps, load:ex.load}),
        ...(liveNotes[ex.id] ? {sessionNote: liveNotes[ex.id]} : {})
      }))
    };
    const newLog = [...(data.log||[]).filter(e=>e.date!==todayStr()), {date:todayStr(),type:"gym",session:sessionKey}];
    onUpdate({...data, history:[entry,...(data.history||[])].slice(0,30), log:newLog});
    onBack();
  };

  return(
    <div style={{minHeight:"100vh",background:"#0a0f1e",color:"#fff",fontFamily:"'Outfit',sans-serif"}}>
      <div style={{padding:"16px 20px 0",display:"flex",alignItems:"center",gap:12}}>
        <button onClick={onBack} style={{background:"none",border:"none",color:"rgba(255,255,255,0.45)",cursor:"pointer",padding:4}}><Ic.back/></button>
        <div>
          <div style={{fontSize:11,color,fontWeight:700,letterSpacing:2}}>{s.label}</div>
          <div style={{fontSize:14,color:"rgba(255,255,255,0.5)"}}>{s.subtitle}</div>
        </div>
        <div style={{marginLeft:"auto",fontSize:13,color:"rgba(255,255,255,0.35)"}}>
          {step+1}/{totalSteps}
        </div>
      </div>

      <div style={{margin:"12px 20px 0",height:3,background:"rgba(255,255,255,0.07)",borderRadius:2}}>
        <div style={{height:"100%",borderRadius:2,background:color,
          width:`${step >= totalSteps ? 100 : (step/totalSteps)*95}%`,
          transition:"width 0.4s"}}/>
      </div>

      <div style={{padding:"20px 20px 100px"}}>
        {/* Indicateur kiné vs exercice principal */}
        {step < KINE_EX.length && (
          <div style={{background:"rgba(100,116,139,0.1)",border:"1px solid rgba(100,116,139,0.25)",borderRadius:10,padding:"8px 12px",marginBottom:14,fontSize:12,color:"rgba(100,116,139,0.9)"}}>
            🩺 Bloc kiné — {step+1}/{KINE_EX.length}
          </div>
        )}

        {curEx && displayEx && (
          <div>
            <div style={{background:"rgba(255,255,255,0.04)",borderRadius:16,padding:"20px",border:`1px solid ${useAlt?"rgba(245,158,11,0.3)":color+"30"}`,marginBottom:16}}>
              <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:12,gap:10}}>
                <div style={{fontSize:21,fontWeight:700,lineHeight:1.3,flex:1}}>{displayEx.name}</div>
                {curEx.alt && step >= KINE_EX.length && (
                  <button onClick={()=>handleToggleNoEquip(curEx.id)}
                    style={{background:useAlt?"rgba(245,158,11,0.2)":"rgba(255,255,255,0.08)",border:useAlt?"1px solid rgba(245,158,11,0.4)":"1px solid rgba(255,255,255,0.15)",borderRadius:10,padding:"7px 11px",color:useAlt?"#f59e0b":"rgba(255,255,255,0.5)",cursor:"pointer",display:"flex",gap:5,alignItems:"center",fontSize:12,fontWeight:600,flexShrink:0}}>
                    {useAlt?<Ic.equip/>:<Ic.noequip/>}
                    {useAlt?"Élastique":"No équip"}
                  </button>
                )}
              </div>

              {useAlt && (
                <div style={{fontSize:12,color:"#f59e0b",background:"rgba(245,158,11,0.08)",borderRadius:8,padding:"6px 10px",marginBottom:12}}>
                  ⚡ Mode sans matériel activé
                </div>
              )}

              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:8,marginBottom:14}}>
                {[
                  ["Séries", curData.sets],
                  ["Reps", curData.reps],
                  ["Charge", curData.load],
                  ["Repos/série", (curData.rest ?? curEx.rest) + '"']
                ].map(([label,val])=>(
                  <div key={label} style={{background:"rgba(255,255,255,0.07)",borderRadius:10,padding:"10px 4px",textAlign:"center"}}>
                    <div style={{fontSize:15,fontWeight:700,color:useAlt?"#f59e0b":color,lineHeight:1.2}}>{val}</div>
                    <div style={{fontSize:9,color:"rgba(255,255,255,0.38)",marginTop:3}}>{label}</div>
                  </div>
                ))}
              </div>

              <div style={{fontSize:13,color:"rgba(255,255,255,0.4)",fontStyle:"italic",background:"rgba(255,255,255,0.04)",padding:"8px 12px",borderRadius:8,marginBottom:12}}>
                💡 {displayEx.notes}
              </div>

              <div>
                <div style={{fontSize:11,color:"rgba(255,255,255,0.3)",letterSpacing:1,marginBottom:6}}>NOTE DE SÉANCE</div>
                <textarea
                  value={liveNotes[curEx.id]||""}
                  onChange={e=>setLiveNotes(n=>({...n,[curEx.id]:e.target.value}))}
                  rows={2}
                  placeholder="Douleur, ressenti, charge utilisée, variante..."
                  style={{width:"100%",background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.1)",
                    borderRadius:10,padding:"10px 14px",color:"#fff",fontSize:13,fontFamily:"inherit",
                    resize:"none",boxSizing:"border-box",outline:"none"}}
                />
              </div>
            </div>

            <button onClick={step+1 >= totalSteps ? completeSession : ()=>setStep(s=>s+1)}
              style={{width:"100%",padding:"16px",background:step+1>=totalSteps?"#22c55e":color,border:"none",borderRadius:14,
                color:"#fff",fontSize:16,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
              <Ic.check/> {step+1>=totalSteps ? "Terminer la séance ✓" : "Exercice terminé →"}
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── HISTORY VIEW ─────────────────────────────────────────────────────────────
function HistoryView({history, onBack, onClear, onReview, onExport, onImport, onUpdateDate}){
  const fileRef = useRef(null);
  const [dateEditEntry, setDateEditEntry] = useState(null);

  const handleSaveDate = (index, newDate) => {
    onUpdateDate(index, newDate);
    setDateEditEntry(null);
  };

  return(
    <div style={{minHeight:"100vh",background:"#0a0f1e",color:"#fff",fontFamily:"'Outfit',sans-serif"}}>
      <div style={{padding:"16px 20px",display:"flex",alignItems:"center",gap:10,borderBottom:"1px solid rgba(255,255,255,0.07)"}}>
        <button onClick={onBack} style={{background:"none",border:"none",color:"rgba(255,255,255,0.45)",cursor:"pointer",padding:4}}><Ic.back/></button>
        <div style={{fontSize:18,fontWeight:700}}>Historique</div>
        <div style={{marginLeft:"auto",display:"flex",gap:8,alignItems:"center"}}>
          <button onClick={()=>fileRef.current.click()} style={{background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.12)",color:"rgba(255,255,255,0.6)",borderRadius:8,padding:"5px 10px",fontSize:12,cursor:"pointer"}}>
            📥 Importer
          </button>
          <input ref={fileRef} type="file" accept=".json" style={{display:"none"}}
            onChange={e=>{ if(e.target.files[0]) onImport(e.target.files[0]); e.target.value=""; }}/>
          <button onClick={onExport} style={{background:"rgba(14,165,233,0.12)",border:"1px solid rgba(14,165,233,0.3)",color:"#0ea5e9",borderRadius:8,padding:"5px 10px",fontSize:12,cursor:"pointer",fontWeight:600}}>
            📤 Exporter
          </button>
          {history.length>0&&<button onClick={onClear} style={{background:"none",border:"1px solid rgba(255,80,80,0.3)",color:"rgba(255,100,100,0.7)",borderRadius:8,padding:"5px 10px",fontSize:12,cursor:"pointer",display:"flex",gap:5,alignItems:"center"}}>
            <Ic.trash/>
          </button>}
        </div>
      </div>

      <div style={{padding:"16px 20px 40px"}}>
        {!history.length&&<div style={{textAlign:"center",color:"rgba(255,255,255,0.2)",paddingTop:60,fontSize:15}}>Aucune activité enregistrée</div>}
        {history.map((entry,i)=>{
          const isSurf = entry.type==="surf";
          const sessionKey = entry.session;
          const col = isSurf ? "#22d3ee" : (PROGRAM[sessionKey]?.color||"#888");
          const canReview = !isSurf && PROGRAM[sessionKey];
          return(
            <div key={i} style={{background:"rgba(255,255,255,0.04)",borderRadius:14,border:`1px solid ${col}25`,marginBottom:12,overflow:"hidden"}}>
              <div style={{background:`${col}15`,padding:"12px 16px",display:"flex",alignItems:"center",gap:10}}>
                <div style={{fontSize:20}}>{isSurf?"🏄":"💪"}</div>
                <div style={{flex:1}}>
                  <div style={{fontSize:13,color:col,fontWeight:700}}>{isSurf?"SESSION SURF":entry.label}</div>
                  <div style={{display:"flex",alignItems:"center",gap:6,marginTop:2}}>
                    <div style={{fontSize:12,color:"rgba(255,255,255,0.35)"}}>{entry.date}</div>
                    <button onClick={()=>setDateEditEntry({entry,index:i})}
                      style={{background:"none",border:"none",color:"rgba(255,255,255,0.3)",cursor:"pointer",padding:"2px 5px",display:"flex",alignItems:"center",gap:3,fontSize:11}}>
                      <Ic.calendar/> modifier
                    </button>
                  </div>
                </div>
                {canReview&&(
                  <button onClick={()=>onReview(sessionKey)} style={{background:`${col}20`,border:`1px solid ${col}35`,borderRadius:8,padding:"5px 10px",color:col,cursor:"pointer",fontSize:12,fontWeight:600,display:"flex",gap:4,alignItems:"center"}}>
                    <Ic.edit/> Voir
                  </button>
                )}
              </div>
              {!isSurf&&entry.exercises&&(
                <div style={{padding:"10px 16px"}}>
                  {entry.exercises.map((ex,j)=>(
                    <div key={j} style={{padding:"5px 0",borderBottom:j<entry.exercises.length-1?"1px solid rgba(255,255,255,0.05)":"none"}}>
                      <div style={{display:"flex",justifyContent:"space-between"}}>
                        <div style={{fontSize:13,color:"rgba(255,255,255,0.6)",flex:1}}>{ex.name}</div>
                        <div style={{fontSize:13,color:col,fontWeight:600,marginLeft:10}}>{ex.sets}×{ex.reps}</div>
                      </div>
                      {ex.sessionNote&&(
                        <div style={{fontSize:12,color:"rgba(255,200,100,0.7)",marginTop:2,fontStyle:"italic"}}>📝 {ex.sessionNote}</div>
                      )}
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </div>

      {dateEditEntry && (
        <DateEditModal entry={dateEditEntry.entry} entryIndex={dateEditEntry.index}
          onSave={handleSaveDate} onClose={()=>setDateEditEntry(null)}/>
      )}
    </div>
  );
}

// ─── WEEK STRIP ───────────────────────────────────────────────────────────────
function WeekStrip({log}){
  const now=new Date(); const monday=new Date(now);
  monday.setDate(now.getDate()-((now.getDay()+6)%7)); monday.setHours(0,0,0,0);
  const days=["L","M","M","J","V","S","D"];
  const weekLog=getWeekLog(log);
  const surfCount=weekLog.filter(e=>e.type==="surf").length;
  const gymCount=weekLog.filter(e=>e.type==="gym").length;
  return(
    <div style={{background:"rgba(255,255,255,0.04)",borderRadius:16,padding:"16px",marginBottom:16,border:"1px solid rgba(255,255,255,0.07)"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <div style={{fontSize:11,color:"rgba(255,255,255,0.35)",fontWeight:700,letterSpacing:2}}>CETTE SEMAINE</div>
        <div style={{display:"flex",gap:12}}>
          <span style={{fontSize:13,color:"#22d3ee"}}>🏄 {surfCount}</span>
          <span style={{fontSize:13,color:"#a78bfa"}}>💪 {gymCount}</span>
        </div>
      </div>
      <div style={{display:"flex",gap:5}}>
        {days.map((d,i)=>{
          const day=new Date(monday); day.setDate(monday.getDate()+i);
          const ds=localDateStr(day);
          const entry=log.find(e=>e.date===ds);
          const isToday=ds===todayStr();
          let bg="rgba(255,255,255,0.04)",icon=null,borderCol="transparent";
          if(entry?.type==="surf"){bg="rgba(34,211,238,0.12)";icon="🏄";borderCol="#22d3ee";}
          if(entry?.type==="gym"){const c=PROGRAM[entry.session]?.color||"#888";bg=c+"20";icon="💪";borderCol=c;}
          if(isToday&&!entry)borderCol="rgba(255,255,255,0.25)";
          return(
            <div key={i} style={{flex:1,textAlign:"center"}}>
              <div style={{fontSize:10,marginBottom:4,color:isToday?"#fff":"rgba(255,255,255,0.25)",fontWeight:isToday?700:400}}>{d}</div>
              <div style={{borderRadius:9,padding:"7px 3px",background:bg,border:`1.5px solid ${borderCol}`,minHeight:38,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:1}}>
                {icon&&<span style={{fontSize:13}}>{icon}</span>}
                {entry?.type==="gym"&&<span style={{fontSize:8,color:PROGRAM[entry.session]?.color,fontWeight:700}}>{entry.session}</span>}
                {isToday&&!entry&&<div style={{width:4,height:4,borderRadius:"50%",background:"rgba(255,255,255,0.35)"}}/>}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── STATUS CARD ─────────────────────────────────────────────────────────────
function StatusCard({statusInfo,nextSess,onSurf,onStartGym}){
  const{status,reason,todayType,session}=statusInfo;
  const s=PROGRAM[nextSess];
  const sessionIcon=nextSess==="PUSH"?"🔵":nextSess==="PULL"?"🟢":nextSess==="LEGS"?"🟠":"⚡";
  if(status==="done"){
    const isGym=todayType==="gym";
    return(
      <div style={{background:"rgba(255,255,255,0.04)",borderRadius:16,padding:"22px",border:"1px solid rgba(255,255,255,0.1)",textAlign:"center",marginBottom:16}}>
        <div style={{fontSize:40,marginBottom:10}}>{isGym?"💪":"🏄"}</div>
        <div style={{fontSize:18,fontWeight:700,marginBottom:4}}>{isGym?`Séance ${session} bouclée !`:"Surf enregistré !"}</div>
        <div style={{fontSize:14,color:"rgba(255,255,255,0.4)"}}>Repos aujourd'hui et demain — reprise J+2</div>
      </div>
    );
  }
  if(status==="rest"){
    return(
      <div style={{background:"rgba(251,191,36,0.07)",borderRadius:16,padding:"20px",border:"1px solid rgba(251,191,36,0.2)",marginBottom:16}}>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:12}}>
          <div style={{fontSize:32}}>😴</div>
          <div>
            <div style={{fontSize:16,fontWeight:700,color:"#fbbf24"}}>Repos</div>
            <div style={{fontSize:13,color:"rgba(255,255,255,0.45)",marginTop:2}}>{reason}</div>
          </div>
        </div>
        <div style={{fontSize:13,color:"rgba(255,255,255,0.35)",background:"rgba(255,255,255,0.04)",borderRadius:10,padding:"10px 14px"}}>
          ⏭ Prochaine : <span style={{color:"#fbbf24",fontWeight:700}}>{sessionIcon} {s.label} — {s.subtitle}</span>
        </div>
      </div>
    );
  }
  if(status==="warning"){
    return(
      <div style={{background:"rgba(239,68,68,0.07)",borderRadius:16,padding:"20px",border:"1px solid rgba(239,68,68,0.25)",marginBottom:16}}>
        <div style={{fontSize:14,color:"#f87171",fontWeight:600,marginBottom:12}}>⚠️ {reason} — C'est le moment de bouger !</div>
        <div style={{display:"flex",gap:10}}>
          <button onClick={()=>onStartGym(nextSess)} style={{...btn(s.color),flex:2,justifyContent:"center",padding:"12px"}}>{sessionIcon} {s.label}</button>
          <button onClick={onSurf} style={{...btn("rgba(34,211,238,0.18)",{border:"1px solid rgba(34,211,238,0.35)"}),flex:1,justifyContent:"center",padding:"12px"}}>🏄 Surf</button>
        </div>
      </div>
    );
  }
  return(
    <div style={{background:`${s.color}10`,borderRadius:16,padding:"20px",border:`1px solid ${s.color}30`,marginBottom:16}}>
      <div style={{fontSize:11,color:s.color,fontWeight:700,letterSpacing:2,marginBottom:8}}>PROCHAINE SÉANCE</div>
      <div style={{fontSize:22,fontWeight:800,marginBottom:3}}>{sessionIcon} {s.label}</div>
      <div style={{fontSize:14,color:"rgba(255,255,255,0.5)",marginBottom:18}}>{s.subtitle}</div>
      <div style={{display:"flex",gap:10}}>
        <button onClick={()=>onStartGym(nextSess)} style={{...btn(s.color),flex:2,justifyContent:"center",padding:"13px",fontSize:15}}><Ic.play/> Commencer</button>
        <button onClick={onSurf} style={{...btn("rgba(34,211,238,0.15)",{border:"1px solid rgba(34,211,238,0.3)"}),flex:1,justifyContent:"center",padding:"13px"}}>🏄 J'ai surfé</button>
      </div>
    </div>
  );
}

// ─── HOME ─────────────────────────────────────────────────────────────────────
function Home({data,onUpdate,onStartGym,onHistory}){
  const log=data.log||[];
  const statusInfo=computeStatus(log);
  const next=nextSession(log);
  const handleSurf=()=>{
    const newLog=[...log.filter(e=>e.date!==todayStr()),{date:todayStr(),type:"surf"}];
    const newHistory=[{date:todayStr(),type:"surf"},...(data.history||[])].slice(0,30);
    onUpdate({...data,log:newLog,history:newHistory});
  };
  const sessionIcons={PUSH:"🔵",PULL:"🟢",LEGS:"🟠",ATHLETIC:"⚡"};
  return(
    <div style={{minHeight:"100vh",background:"#0a0f1e",color:"#fff",fontFamily:"'Outfit',sans-serif"}}>
      <div style={{padding:"36px 22px 18px",background:"linear-gradient(160deg,#0e1e3a 0%,#0a0f1e 100%)"}}>
        <div style={{fontSize:11,color:"rgba(255,255,255,0.3)",letterSpacing:3,marginBottom:6}}>
          {new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"}).toUpperCase()}
        </div>
        <div style={{fontSize:27,fontWeight:800,lineHeight:1.15}}>Surf & <span style={{color:"#0ea5e9"}}>Athlétisme</span></div>
      </div>
      <div style={{padding:"16px 20px 100px"}}>
        <WeekStrip log={log}/>
        <StatusCard statusInfo={statusInfo} nextSess={next} onSurf={handleSurf} onStartGym={onStartGym}/>
        <div style={{fontSize:11,color:"rgba(255,255,255,0.3)",letterSpacing:2,marginBottom:12,marginTop:8}}>TOUTES LES SÉANCES</div>
        {Object.entries(PROGRAM).map(([key,s])=>(
          <button key={key} onClick={()=>onStartGym(key)} style={{width:"100%",background:"rgba(255,255,255,0.03)",border:`1px solid rgba(255,255,255,0.07)`,borderRadius:14,padding:"13px 16px",marginBottom:9,cursor:"pointer",textAlign:"left",display:"flex",alignItems:"center",gap:14}}>
            <div style={{width:40,height:40,borderRadius:10,background:`${s.color}1a`,border:`1px solid ${s.color}35`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>
              {sessionIcons[key]}
            </div>
            <div style={{flex:1}}>
              <div style={{fontSize:15,fontWeight:700,color:key===next?s.color:"rgba(255,255,255,0.8)"}}>{s.label}</div>
              <div style={{fontSize:12,color:"rgba(255,255,255,0.35)",marginTop:1}}>{s.subtitle}</div>
            </div>
            {key===next&&<div style={{fontSize:10,color:s.color,fontWeight:700,background:`${s.color}18`,padding:"3px 9px",borderRadius:20,border:`1px solid ${s.color}30`}}>NEXT</div>}
          </button>
        ))}
        <button onClick={onHistory} style={{width:"100%",background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:14,padding:"13px 16px",cursor:"pointer",textAlign:"left",display:"flex",alignItems:"center",gap:14,marginTop:2}}>
          <div style={{width:40,height:40,borderRadius:10,background:"rgba(255,255,255,0.06)",display:"flex",alignItems:"center",justifyContent:"center"}}><Ic.history/></div>
          <div style={{flex:1}}>
            <div style={{fontSize:15,fontWeight:600,color:"rgba(255,255,255,0.7)"}}>Historique</div>
            <div style={{fontSize:12,color:"rgba(255,255,255,0.3)",marginTop:1}}>{(data.history||[]).length} activité{(data.history||[]).length!==1?"s":""}</div>
          </div>
        </button>
      </div>
    </div>
  );
}

// ─── ONBOARDING ───────────────────────────────────────────────────────────────
function Onboarding({onDone}){
  const [lastSession,setLastSession]=useState(null);
  const sessionIcons={PUSH:"🔵",PULL:"🟢",LEGS:"🟠",ATHLETIC:"⚡"};
  const confirm=()=>{
    if(!lastSession)return;
    const twoDaysAgo=localDateStr(new Date(Date.now()-2*86400000));
    onDone({
      log:[{date:twoDaysAgo,type:"gym",session:lastSession}],
      history:[{date:twoDaysAgo,type:"gym",session:lastSession,label:PROGRAM[lastSession].label,
        exercises:PROGRAM[lastSession].exercises.map(e=>({name:e.name,sets:e.sets,reps:e.reps,load:e.load}))}],
    });
  };
  return(
    <div style={{minHeight:"100vh",background:"#0a0f1e",color:"#fff",fontFamily:"'Outfit',sans-serif",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"32px 24px"}}>
      <div style={{fontSize:40,marginBottom:20}}>🏄</div>
      <div style={{fontSize:24,fontWeight:800,marginBottom:8,textAlign:"center"}}>Bienvenue !</div>
      <div style={{fontSize:15,color:"rgba(255,255,255,0.5)",textAlign:"center",marginBottom:36,lineHeight:1.6}}>
        Pour calibrer ta rotation PUSH→PULL→LEGS→ATHLETIC,<br/>quelle était ta dernière séance ?
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:12,width:"100%",maxWidth:320}}>
        {Object.entries(PROGRAM).map(([key,s])=>(
          <button key={key} onClick={()=>setLastSession(key)} style={{padding:"16px 20px",borderRadius:14,border:`2px solid ${lastSession===key?s.color:"rgba(255,255,255,0.1)"}`,background:lastSession===key?`${s.color}18`:"rgba(255,255,255,0.04)",color:"#fff",cursor:"pointer",textAlign:"left",display:"flex",alignItems:"center",gap:14}}>
            <div style={{fontSize:22}}>{sessionIcons[key]}</div>
            <div>
              <div style={{fontSize:16,fontWeight:700,color:lastSession===key?s.color:"#fff"}}>{s.label}</div>
              <div style={{fontSize:13,color:"rgba(255,255,255,0.4)",marginTop:2}}>{s.subtitle}</div>
            </div>
            {lastSession===key&&<div style={{marginLeft:"auto",fontSize:18}}>✓</div>}
          </button>
        ))}
        <button onClick={()=>onDone({log:[],history:[]})} style={{padding:"13px",borderRadius:14,border:"1px solid rgba(255,255,255,0.1)",background:"none",color:"rgba(255,255,255,0.4)",cursor:"pointer",fontSize:14,marginTop:4}}>
          C'est mon premier entraînement
        </button>
      </div>
      {lastSession&&(
        <button onClick={confirm} style={{marginTop:28,padding:"14px 40px",background:PROGRAM[lastSession].color,border:"none",borderRadius:14,color:"#fff",fontSize:16,fontWeight:700,cursor:"pointer"}}>
          Confirmer → Prochaine : {SESSION_ORDER[(SESSION_ORDER.indexOf(lastSession)+1)%SESSION_ORDER.length]}
        </button>
      )}
    </div>
  );
}

// ─── APP ──────────────────────────────────────────────────────────────────────
function App(){
  const [data,setData]=useState(loadData);
  const [screen,setScreen]=useState("home");
  const [activeSession,setActive]=useState(null);

  useEffect(()=>{ saveData(data); },[data]);
  const update = d => setData(d);

  const handleUpdateDate = (historyIndex, newDate) => {
    setData(d => {
      const newHistory = [...(d.history||[])];
      const oldDate = newHistory[historyIndex].date;
      newHistory[historyIndex] = {...newHistory[historyIndex], date: newDate};
      let newLog = [...(d.log||[])];
      const entry = newHistory[historyIndex];
      const logIdx = newLog.findIndex(e => e.date === oldDate && e.type === entry.type);
      if (logIdx !== -1) newLog[logIdx] = {...newLog[logIdx], date: newDate};
      return {...d, history: newHistory, log: newLog};
    });
  };

  if(!data.initialized){
    return <Onboarding onDone={(init)=>{
      setData({...EMPTY_DATA, history:init.history||[], log:init.log||[], initialized:true});
    }}/>;
  }

  if(screen==="history") return <HistoryView
    history={data.history||[]}
    onBack={()=>setScreen("home")}
    onReview={key=>{setActive(key);setScreen("review");}}
    onExport={()=>exportData(data)}
    onImport={(file)=>importData(file,d=>{setData(d);setScreen("home");},()=>alert("Fichier invalide"))}
    onClear={()=>{if(confirm("Effacer tout l'historique ?"))setData(d=>({...d,history:[],log:[]}));}}
    onUpdateDate={handleUpdateDate}/>;

  if(screen==="review"&&activeSession) return <SessionPreview sessionKey={activeSession} data={data}
    onUpdate={update} onStart={null} onBack={()=>setScreen("history")} readOnly={true}/>;

  if(screen==="preview"&&activeSession) return <SessionPreview sessionKey={activeSession} data={data}
    onUpdate={update} onStart={()=>setScreen("session")} onBack={()=>setScreen("home")} readOnly={false}/>;

  if(screen==="session"&&activeSession) return <SessionView sessionKey={activeSession} data={data}
    onUpdate={update} onBack={()=>setScreen("home")}/>;

  return <Home data={data} onUpdate={update}
    onStartGym={k=>{setActive(k);setScreen("preview");}}
    onHistory={()=>setScreen("history")}/>;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
  </script>
</body>
