const SESSION_ORDER = ["PUSH","PULL","LEGS","ATHLETIC"];
const STORAGE_KEY = "surf_tracker_v6";
const EMPTY_DATA = { overrides:{}, history:[], log:[], initialized:false, noEquip:{} };

function loadData() {
  try {
    const cur = localStorage.getItem(STORAGE_KEY);
    if (cur) return {...EMPTY_DATA, ...JSON.parse(cur)};
    // Migration depuis v4
    const old = localStorage.getItem("surf_tracker_v4");
    if (old) {
      const p = JSON.parse(old);
      return {...EMPTY_DATA, history:p.history||[], log:p.log||[], initialized:true};
    }
    return EMPTY_DATA;
  } catch { return EMPTY_DATA; }
}
function saveData(d) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); } catch {} }

function exportData(d) {
  const blob = new Blob([JSON.stringify(d,null,2)],{type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href=url; a.download=`surf-training-backup-${new Date().toISOString().split("T")[0]}.json`;
  a.click(); URL.revokeObjectURL(url);
}
function importData(file, onSuccess, onError) {
  const r = new FileReader();
  r.onload = e => {
    try {
      const p = JSON.parse(e.target.result);
      if (!p.log || !p.overrides) throw new Error();
      onSuccess({...EMPTY_DATA,...p,initialized:true});
    } catch { onError(); }
  };
  r.readAsText(file);
}

function localDateStr(d) {
  const dt=d||new Date();
  return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
}
function todayStr() { return localDateStr(); }
function daysDiff(a,b) { return Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/86400000); }

function computeStatus(log) {
  const today=todayStr(), yesterday=localDateStr(new Date(Date.now()-86400000));
  const te=log.find(e=>e.date===today), ye=log.find(e=>e.date===yesterday);
  if(te) return {status:"done",todayType:te.type,session:te.session};
  if(ye?.type==="surf") return {status:"rest",reason:"Tu as surfé hier — repos J+1"};
  if(ye?.type==="gym")  return {status:"ready"};
  const last=[...log].sort((a,b)=>b.date.localeCompare(a.date))[0];
  if(!last) return {status:"ready"};
  const ds=daysDiff(last.date,today);
  if(ds>=3) return {status:"warning",reason:`${ds} jours sans activité`};
  return {status:"ready"};
}
function nextSession(log) {
  const gym=log.filter(e=>e.type==="gym").sort((a,b)=>b.date.localeCompare(a.date));
  if(!gym.length) return "PUSH";
  const idx=SESSION_ORDER.indexOf(gym[0].session);
  return SESSION_ORDER[(idx+1)%SESSION_ORDER.length];
}
function getWeekLog(log) {
  const now=new Date(),mon=new Date(now);
  mon.setDate(now.getDate()-((now.getDay()+6)%7)); mon.setHours(0,0,0,0);
  return log.filter(e=>new Date(e.date+"T12:00:00")>=mon);
}

  const sets = override?.sets ?? disp.sets;
  const reps = override?.reps ?? disp.reps;
  const load = override?.load ?? disp.load;
  const rest = override?.rest ?? ex.rest;
  const modified = !!(override?.sets||override?.reps||override?.load||override?.rest);
  return(
    <div style={{marginBottom:10,background:"rgba(255,255,255,0.03)",borderRadius:12,
      border:`1px solid ${useAlt?"rgba(245,158,11,0.35)":modified?color+"40":"rgba(255,255,255,0.06)"}`,overflow:"hidden"}}>
      <div style={{display:"flex",alignItems:"flex-start",gap:12,padding:"12px 14px"}}>
        <div style={{width:26,height:26,borderRadius:"50%",background:`${color}20`,border:`1px solid ${color}40`,
          display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700,color,flexShrink:0,marginTop:1}}>{idx+1}</div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:15,fontWeight:600,marginBottom:4,display:"flex",flexWrap:"wrap",gap:6,alignItems:"center"}}>
            {disp.name}
            {useAlt&&<span style={{fontSize:10,color:"#f59e0b",background:"rgba(245,158,11,0.12)",padding:"1px 6px",borderRadius:10}}>sans matériel</span>}
            {modified&&!useAlt&&<span style={{fontSize:10,color,background:`${color}18`,padding:"1px 6px",borderRadius:10}}>modifié</span>}
          </div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:compact?0:4}}>
            <span style={{fontSize:12,background:"rgba(255,255,255,0.07)",borderRadius:6,padding:"2px 8px",color:"rgba(255,255,255,0.7)"}}>{sets} séries</span>
            <span style={{fontSize:12,background:"rgba(255,255,255,0.07)",borderRadius:6,padding:"2px 8px",color:"rgba(255,255,255,0.7)"}}>{reps}</span>
            <span style={{fontSize:12,background:useAlt?"rgba(245,158,11,0.15)":`${color}18`,borderRadius:6,padding:"2px 8px",color:useAlt?"#f59e0b":color,fontWeight:600}}>{load}</span>

  const [editId,setEditId]=useState(null);
  const noEquip=data.noEquip||{};

  const toggle=id=>{
    const n={...data.noEquip||{}}; n[id]=!n[id];
    onUpdate({...data,noEquip:n});
  };
  const saveEdit=(id,vals)=>{ onUpdate({...data,overrides:{...data.overrides,[id]:vals}}); setEditId(null); };
  const editEx=editId ? s.exercises.find(e=>e.id===editId) : null;

  return(
    <div style={{minHeight:"100vh",background:"#0a0f1e",color:"#fff",fontFamily:"'Outfit',sans-serif"}}>

      </div>

      <div style={{padding:"20px 20px",paddingBottom:readOnly?"40px":"120px"}}>
        <div style={{background:`${color}12`,border:`1px solid ${color}30`,borderRadius:14,padding:"14px 16px",marginBottom:20,display:"flex",gap:16,alignItems:"center"}}>

// ─── SESSION VIEW ─────────────────────────────────────────────────────────────
function SessionView({sessionKey,data,onUpdate,onBack}){
  const s=PROGRAM[sessionKey], color=s.color;
  const [step,setStep]=useState(-1); // -1 = ouverture
  const [liveNotes,setLiveNotes]=useState({});
  const noEquip=data.noEquip||{};

  const exs=s.exercises;
  const total=exs.length;
  const atOpening=step===-1;
  const curEx=step>=0&&step<total?exs[step]:null;
  const useAlt=curEx&&noEquip[curEx.id]&&curEx.alt;
  const dispEx=useAlt?{...curEx,...curEx.alt}:curEx;
  const curData=curEx?(data.overrides[curEx.id]||{sets:dispEx.sets,reps:dispEx.reps,load:dispEx.load,rest:curEx.rest}):null;
  const atEnd=step>=total;

  const toggle=id=>{ const n={...noEquip}; n[id]=!n[id]; onUpdate({...data,noEquip:n}); };

  const finish=()=>{
    const entry={date:todayStr(),type:"gym",session:sessionKey,label:s.label,
      exercises:exs.map(ex=>({
        name:(noEquip[ex.id]&&ex.alt)?ex.alt.name:ex.name,
        ...(data.overrides[ex.id]||{sets:ex.sets,reps:ex.reps,load:ex.load}),
        ...(liveNotes[ex.id]?{sessionNote:liveNotes[ex.id]}:{})
      }))};
    const newLog=[...(data.log||[]).filter(e=>e.date!==todayStr()),{date:todayStr(),type:"gym",session:sessionKey}];
    onUpdate({...data,history:[entry,...(data.history||[])].slice(0,30),log:newLog});
    onBack();
  };

  return(
    <div style={{minHeight:"100vh",background:"#0a0f1e",color:"#fff",fontFamily:"'Outfit',sans-serif"}}>
      <div style={{padding:"16px 20px 0",display:"flex",alignItems:"center",gap:12}}>
        <button onClick={onBack} style={{background:"none",border:"none",color:"rgba(255,255,255,0.45)",cursor:"pointer",padding:4}}><Ic.back/></button>
        <div>
          <div style={{fontSize:11,color,fontWeight:700,letterSpacing:2}}>{s.label}</div>
          <div style={{fontSize:14,color:"rgba(255,255,255,0.5)"}}>{s.subtitle}</div>
        </div>
        <div style={{marginLeft:"auto",fontSize:13,color:"rgba(255,255,255,0.35)"}}>
          {atOpening?"Ouverture":atEnd?"Terminé":`${step+1}/${total}`}
        </div>
      </div>

      <div style={{margin:"12px 20px 0",height:3,background:"rgba(255,255,255,0.07)",borderRadius:2}}>
        <div style={{height:"100%",borderRadius:2,background:color,
          width:`${atOpening?5:atEnd?100:((step+1)/total)*95}%`,transition:"width 0.4s"}}/>
      </div>

      <div style={{padding:"20px 20px 100px"}}>
        {atOpening&&(
          <div>
            <div style={{background:"rgba(255,255,255,0.04)",borderRadius:16,padding:"24px 20px",border:"1px solid rgba(255,255,255,0.08)",marginBottom:16,textAlign:"center"}}>
              <div style={{fontSize:36,marginBottom:12}}>🔥</div>
              <div style={{fontSize:20,fontWeight:700,marginBottom:8}}>Ouverture — 5 min</div>
              <div style={{fontSize:14,color:"rgba(255,255,255,0.5)",lineHeight:1.6}}>Échauffement sur mesure selon tes sensations.<br/>Rotations, mobilité, activation — à toi de jouer.</div>
            </div>
            <button onClick={()=>setStep(0)} style={{width:"100%",padding:"16px",background:color,border:"none",borderRadius:14,color:"#fff",fontSize:16,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
              <Ic.play/> Commencer les exercices →
            </button>
          </div>
        )}

        {curEx&&dispEx&&(
          <div>
            <div style={{background:"rgba(255,255,255,0.04)",borderRadius:16,padding:"20px",border:`1px solid ${useAlt?"rgba(245,158,11,0.3)":color+"30"}`,marginBottom:16}}>
              <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:12,gap:10}}>
                <div style={{fontSize:21,fontWeight:700,lineHeight:1.3,flex:1}}>{dispEx.name}</div>
                {curEx.alt&&(
                  <button onClick={()=>toggle(curEx.id)} style={{background:useAlt?"rgba(245,158,11,0.2)":"rgba(255,255,255,0.08)",border:useAlt?"1px solid rgba(245,158,11,0.4)":"1px solid rgba(255,255,255,0.15)",borderRadius:10,padding:"7px 11px",color:useAlt?"#f59e0b":"rgba(255,255,255,0.5)",cursor:"pointer",fontSize:11,fontWeight:700,flexShrink:0}}>
                    {useAlt?"+ élastique":"no équip"}
                  </button>
                )}
              </div>
              {useAlt&&<div style={{fontSize:12,color:"#f59e0b",background:"rgba(245,158,11,0.08)",borderRadius:8,padding:"6px 10px",marginBottom:12}}>⚡ Version sans matériel</div>}
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:8,marginBottom:14}}>
                {[["Séries",curData.sets],["Reps",curData.reps],["Charge",curData.load],["Repos/série",(curData.rest??curEx.rest)+'"']].map(([l,v])=>(
                  <div key={l} style={{background:"rgba(255,255,255,0.07)",borderRadius:10,padding:"10px 4px",textAlign:"center"}}>
                    <div style={{fontSize:15,fontWeight:700,color:useAlt?"#f59e0b":color,lineHeight:1.2}}>{v}</div>
                    <div style={{fontSize:9,color:"rgba(255,255,255,0.38)",marginTop:3}}>{l}</div>
                  </div>
                ))}
              </div>
              <div style={{fontSize:13,color:"rgba(255,255,255,0.4)",fontStyle:"italic",background:"rgba(255,255,255,0.04)",padding:"8px 12px",borderRadius:8,marginBottom:12}}>
                💡 {dispEx.notes}
              </div>
              <div>
                <div style={{fontSize:11,color:"rgba(255,255,255,0.3)",letterSpacing:1,marginBottom:6}}>NOTE DE SÉANCE</div>
                <textarea value={liveNotes[curEx.id]||""} onChange={e=>setLiveNotes(n=>({...n,[curEx.id]:e.target.value}))} rows={2}
                  placeholder="Douleur, ressenti, charge, variante..."
                  style={{width:"100%",background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:10,padding:"10px 14px",color:"#fff",fontSize:13,fontFamily:"inherit",resize:"none",boxSizing:"border-box",outline:"none"}}/>
              </div>
            </div>
            <button onClick={step+1>=total?finish:()=>setStep(s=>s+1)}
              style={{width:"100%",padding:"16px",background:step+1>=total?"#22c55e":color,border:"none",borderRadius:14,color:"#fff",fontSize:16,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
              <Ic.check/> {step+1>=total?"Terminer la séance ✓":"Exercice terminé →"}
            </button>
          </div>
        )}

        {atEnd&&(
          <div style={{textAlign:"center",padding:"40px 20px"}}>
            <div style={{fontSize:60,marginBottom:16}}>🎉</div>
            <div style={{fontSize:22,fontWeight:800,marginBottom:8}}>Séance terminée !</div>
            <div style={{fontSize:14,color:"rgba(255,255,255,0.4)",marginBottom:32}}>Belle performance — repos bien mérité.</div>
            <button onClick={finish} style={{padding:"16px 40px",background:"#22c55e",border:"none",borderRadius:14,color:"#fff",fontSize:16,fontWeight:700,cursor:"pointer"}}>
              Enregistrer et quitter ✓
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── WEEK STRIP ───────────────────────────────────────────────────────────────
function WeekStrip({log}){
  const now=new Date(),mon=new Date(now);
  mon.setDate(now.getDate()-((now.getDay()+6)%7)); mon.setHours(0,0,0,0);
  const days=["L","M","M","J","V","S","D"],wl=getWeekLog(log);
  return(
    <div style={{background:"rgba(255,255,255,0.04)",borderRadius:16,padding:"16px",marginBottom:16,border:"1px solid rgba(255,255,255,0.07)"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <div style={{fontSize:11,color:"rgba(255,255,255,0.35)",fontWeight:700,letterSpacing:2}}>CETTE SEMAINE</div>
        <div style={{display:"flex",gap:12}}>
          <span style={{fontSize:13,color:"#22d3ee"}}>🏄 {wl.filter(e=>e.type==="surf").length}</span>
          <span style={{fontSize:13,color:"#a78bfa"}}>💪 {wl.filter(e=>e.type==="gym").length}</span>
        </div>
      </div>
      <div style={{display:"flex",gap:5}}>
        {days.map((d,i)=>{
          const day=new Date(mon); day.setDate(mon.getDate()+i);
          const ds=localDateStr(day), entry=log.find(e=>e.date===ds), isToday=ds===todayStr();
          let bg="rgba(255,255,255,0.04)",icon=null,border="transparent";
          if(entry?.type==="surf"){bg="rgba(34,211,238,0.12)";icon="🏄";border="#22d3ee";}
          if(entry?.type==="gym"){const c=PROGRAM[entry.session]?.color||"#888";bg=c+"20";icon="💪";border=c;}
          if(isToday&&!entry)border="rgba(255,255,255,0.25)";
          return(
            <div key={i} style={{flex:1,textAlign:"center"}}>
              <div style={{fontSize:10,marginBottom:4,color:isToday?"#fff":"rgba(255,255,255,0.25)",fontWeight:isToday?700:400}}>{d}</div>
              <div style={{borderRadius:9,padding:"7px 3px",background:bg,border:`1.5px solid ${border}`,minHeight:38,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:1}}>
                {icon&&<span style={{fontSize:13}}>{icon}</span>}
                {entry?.type==="gym"&&<span style={{fontSize:8,color:PROGRAM[entry.session]?.color,fontWeight:700}}>{entry.session}</span>}
                {isToday&&!entry&&<div style={{width:4,height:4,borderRadius:"50%",background:"rgba(255,255,255,0.35)"}}/>}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── STATUS CARD ─────────────────────────────────────────────────────────────
function StatusCard({statusInfo,nextSess,onSurf,onStartGym}){
  const {status,reason,todayType,session}=statusInfo, s=PROGRAM[nextSess];
  if(status==="done") return(
    <div style={{background:"rgba(255,255,255,0.04)",borderRadius:16,padding:"22px",border:"1px solid rgba(255,255,255,0.1)",textAlign:"center",marginBottom:16}}>
      <div style={{fontSize:40,marginBottom:10}}>{todayType==="gym"?"💪":"🏄"}</div>
      <div style={{fontSize:18,fontWeight:700,marginBottom:4}}>{todayType==="gym"?`Séance ${session} bouclée !`:"Surf enregistré !"}</div>
      <div style={{fontSize:14,color:"rgba(255,255,255,0.4)"}}>Repos aujourd'hui et demain — reprise J+2</div>
    </div>
  );
  if(status==="rest") return(
    <div style={{background:"rgba(251,191,36,0.07)",borderRadius:16,padding:"20px",border:"1px solid rgba(251,191,36,0.2)",marginBottom:16}}>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:12}}>
        <div style={{fontSize:32}}>😴</div>
        <div><div style={{fontSize:16,fontWeight:700,color:"#fbbf24"}}>Repos</div><div style={{fontSize:13,color:"rgba(255,255,255,0.45)",marginTop:2}}>{reason}</div></div>
      </div>
      <div style={{fontSize:13,color:"rgba(255,255,255,0.35)",background:"rgba(255,255,255,0.04)",borderRadius:10,padding:"10px 14px"}}>
        ⏭ Prochaine : <span style={{color:"#fbbf24",fontWeight:700}}>{ICON[nextSess]} {s.label}</span>
      </div>
    </div>
  );
  if(status==="warning") return(
    <div style={{background:"rgba(239,68,68,0.07)",borderRadius:16,padding:"20px",border:"1px solid rgba(239,68,68,0.25)",marginBottom:16}}>
      <div style={{fontSize:14,color:"#f87171",fontWeight:600,marginBottom:12}}>⚠️ {reason} — C'est le moment de bouger !</div>
      <div style={{display:"flex",gap:10}}>
        <button onClick={()=>onStartGym(nextSess)} style={{...btn(s.color),flex:2,justifyContent:"center",padding:"12px"}}>{ICON[nextSess]} {s.label}</button>
        <button onClick={onSurf} style={{...btn("rgba(34,211,238,0.18)",{border:"1px solid rgba(34,211,238,0.35)"}),flex:1,justifyContent:"center",padding:"12px"}}>🏄 Surf</button>
      </div>
    </div>
  );
  return(
    <div style={{background:`${s.color}10`,borderRadius:16,padding:"20px",border:`1px solid ${s.color}30`,marginBottom:16}}>
      <div style={{fontSize:11,color:s.color,fontWeight:700,letterSpacing:2,marginBottom:8}}>PROCHAINE SÉANCE</div>
      <div style={{fontSize:22,fontWeight:800,marginBottom:3}}>{ICON[nextSess]} {s.label}</div>
      <div style={{fontSize:14,color:"rgba(255,255,255,0.5)",marginBottom:18}}>{s.subtitle}</div>
      <div style={{display:"flex",gap:10}}>
        <button onClick={()=>onStartGym(nextSess)} style={{...btn(s.color),flex:2,justifyContent:"center",padding:"13px",fontSize:15}}><Ic.play/> Commencer</button>
        <button onClick={onSurf} style={{...btn("rgba(34,211,238,0.15)",{border:"1px solid rgba(34,211,238,0.3)"}),flex:1,justifyContent:"center",padding:"13px"}}>🏄 J'ai surfé</button>
      </div>
    </div>
  );
}

// ─── HOME ─────────────────────────────────────────────────────────────────────
function Home({data,onUpdate,onStartGym,onHistory}){
  const log=data.log||[], status=computeStatus(log), next=nextSession(log);
  const handleSurf=()=>{
    const newLog=[...log.filter(e=>e.date!==todayStr()),{date:todayStr(),type:"surf"}];
    onUpdate({...data,log:newLog,history:[{date:todayStr(),type:"surf"},...(data.history||[])].slice(0,30)});
  };
  return(
    <div style={{minHeight:"100vh",background:"#0a0f1e",color:"#fff",fontFamily:"'Outfit',sans-serif"}}>
      <div style={{padding:"36px 22px 18px",background:"linear-gradient(160deg,#0e1e3a 0%,#0a0f1e 100%)"}}>
        <div style={{fontSize:11,color:"rgba(255,255,255,0.3)",letterSpacing:3,marginBottom:6}}>
          {new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"}).toUpperCase()}
        </div>
        <div style={{fontSize:27,fontWeight:800,lineHeight:1.15}}>Surf & <span style={{color:"#0ea5e9"}}>Athlétisme</span></div>
      </div>
      <div style={{padding:"16px 20px 100px"}}>
        <WeekStrip log={log}/>
        <StatusCard statusInfo={status} nextSess={next} onSurf={handleSurf} onStartGym={onStartGym}/>
        <div style={{fontSize:11,color:"rgba(255,255,255,0.3)",letterSpacing:2,marginBottom:12,marginTop:8}}>TOUTES LES SÉANCES</div>
        {Object.entries(PROGRAM).map(([key,s])=>(
          <button key={key} onClick={()=>onStartGym(key)} style={{width:"100%",background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:14,padding:"13px 16px",marginBottom:9,cursor:"pointer",textAlign:"left",display:"flex",alignItems:"center",gap:14}}>
            <div style={{width:40,height:40,borderRadius:10,background:`${s.color}1a`,border:`1px solid ${s.color}35`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>{ICON[key]}</div>
            <div style={{flex:1}}>
              <div style={{fontSize:15,fontWeight:700,color:key===next?s.color:"rgba(255,255,255,0.8)"}}>{s.label}</div>
              <div style={{fontSize:12,color:"rgba(255,255,255,0.35)",marginTop:1}}>{s.subtitle}</div>
            </div>
            {key===next&&<div style={{fontSize:10,color:s.color,fontWeight:700,background:`${s.color}18`,padding:"3px 9px",borderRadius:20,border:`1px solid ${s.color}30`}}>NEXT</div>}
          </button>
        ))}
        <button onClick={onHistory} style={{width:"100%",background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:14,padding:"13px 16px",cursor:"pointer",textAlign:"left",display:"flex",alignItems:"center",gap:14,marginTop:2}}>
          <div style={{width:40,height:40,borderRadius:10,background:"rgba(255,255,255,0.06)",display:"flex",alignItems:"center",justifyContent:"center"}}><Ic.history/></div>
          <div style={{flex:1}}>
            <div style={{fontSize:15,fontWeight:600,color:"rgba(255,255,255,0.7)"}}>Historique</div>
            <div style={{fontSize:12,color:"rgba(255,255,255,0.3)",marginTop:1}}>{(data.history||[]).length} activité{(data.history||[]).length!==1?"s":""}</div>
          </div>
        </button>
      </div>
    </div>
  );
}

// ─── ONBOARDING ───────────────────────────────────────────────────────────────
function Onboarding({onDone}){
  const [last,setLast]=useState(null);
  const confirm=()=>{
    if(!last)return;
    const d2=localDateStr(new Date(Date.now()-2*86400000));
    onDone({log:[{date:d2,type:"gym",session:last}],
      history:[{date:d2,type:"gym",session:last,label:PROGRAM[last].label,
        exercises:PROGRAM[last].exercises.map(e=>({name:e.name,sets:e.sets,reps:e.reps,load:e.load}))}]});
  };
  return(
    <div style={{minHeight:"100vh",background:"#0a0f1e",color:"#fff",fontFamily:"'Outfit',sans-serif",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"32px 24px"}}>
      <div style={{fontSize:40,marginBottom:20}}>🏄</div>
      <div style={{fontSize:24,fontWeight:800,marginBottom:8,textAlign:"center"}}>Bienvenue !</div>
      <div style={{fontSize:15,color:"rgba(255,255,255,0.5)",textAlign:"center",marginBottom:36,lineHeight:1.6}}>
        Pour calibrer la rotation,<br/>quelle était ta dernière séance ?
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:12,width:"100%",maxWidth:320}}>
        {Object.entries(PROGRAM).map(([key,s])=>(
          <button key={key} onClick={()=>setLast(key)} style={{padding:"16px 20px",borderRadius:14,border:`2px solid ${last===key?s.color:"rgba(255,255,255,0.1)"}`,background:last===key?`${s.color}18`:"rgba(255,255,255,0.04)",color:"#fff",cursor:"pointer",textAlign:"left",display:"flex",alignItems:"center",gap:14}}>
            <div style={{fontSize:22}}>{ICON[key]}</div>
            <div>
              <div style={{fontSize:16,fontWeight:700,color:last===key?s.color:"#fff"}}>{s.label}</div>
              <div style={{fontSize:13,color:"rgba(255,255,255,0.4)",marginTop:2}}>{s.subtitle}</div>
            </div>
            {last===key&&<div style={{marginLeft:"auto",fontSize:18}}>✓</div>}
          </button>
        ))}
        <button onClick={()=>onDone({log:[],history:[]})} style={{padding:"13px",borderRadius:14,border:"1px solid rgba(255,255,255,0.1)",background:"none",color:"rgba(255,255,255,0.4)",cursor:"pointer",fontSize:14,marginTop:4}}>
          C'est mon premier entraînement
        </button>
      </div>
      {last&&(
        <button onClick={confirm} style={{marginTop:28,padding:"14px 40px",background:PROGRAM[last].color,border:"none",borderRadius:14,color:"#fff",fontSize:16,fontWeight:700,cursor:"pointer"}}>
          Confirmer → Prochaine : {SESSION_ORDER[(SESSION_ORDER.indexOf(last)+1)%SESSION_ORDER.length]}
        </button>
      )}
    </div>
  );
}

// ─── APP ──────────────────────────────────────────────────────────────────────
function App(){
  const [data,setData]=useState(loadData);
  const [screen,setScreen]=useState("home");
  const [active,setActive]=useState(null);
  useEffect(()=>{ saveData(data); },[data]);
  const update=d=>setData(d);
  const handleUpdateDate=(idx,newDate)=>{
    setData(d=>{
      const h=[...(d.history||[])], oldDate=h[idx].date;
      h[idx]={...h[idx],date:newDate};
      const l=[...(d.log||[])], li=l.findIndex(e=>e.date===oldDate&&e.type===h[idx].type);
      if(li!==-1)l[li]={...l[li],date:newDate};
      return {...d,history:h,log:l};
    });
  };
  if(!data.initialized) return <Onboarding onDone={init=>setData({...EMPTY_DATA,history:init.history||[],log:init.log||[],initialized:true})}/>;
  if(screen==="history") return <HistoryView history={data.history||[]} onBack={()=>setScreen("home")}
    onReview={k=>{setActive(k);setScreen("review");}} onExport={()=>exportData(data)}
    onImport={f=>importData(f,d=>{setData(d);setScreen("home");},()=>alert("Fichier invalide"))}
    onClear={()=>{if(confirm("Effacer tout l'historique ?"))setData(d=>({...d,history:[],log:[]}));}}
    onUpdateDate={handleUpdateDate}/>;
  if(screen==="review"&&active) return <SessionPreview sessionKey={active} data={data} onUpdate={update} onStart={null} onBack={()=>setScreen("history")} readOnly={true}/>;
  if(screen==="preview"&&active) return <SessionPreview sessionKey={active} data={data} onUpdate={update} onStart={()=>setScreen("session")} onBack={()=>setScreen("home")}/>;
  if(screen==="session"&&active) return <SessionView sessionKey={active} data={data} onUpdate={update} onBack={()=>setScreen("home")}/>;
  return <Home data={data} onUpdate={update} onStartGym={k=>{setActive(k);setScreen("preview");}} onHistory={()=>setScreen("history")}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
  <script>
    if('serviceWorker' in navigator){
      window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
    }
  </script>
</body>
